{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{% if is_edit %}Edit Poll{% else %}Create Poll{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h1 class="h3 mb-4">{% if is_edit %}Edit Poll{% else %}Create a New Poll{% endif %}</h1>
        <div class="card">
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex justify-content-end gap-2 mt-3">
                        <a href="{% if is_edit %}{% url 'poll_detail' poll.pk %}{% else %}{% url 'poll_list' %}{% endif %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            {% if is_edit %}Save Changes{% else %}Save &amp; Add Questions{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
